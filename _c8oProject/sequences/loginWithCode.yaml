    ↓DecodeJWT [steps.SimpleStep-1706637147629]: 
      expression: |
        '//imports
        var xmlUtils = use("com.twinsoft.convertigo.engine.util.XMLUtils");
        
        // Validation de l''id_token FranceConnect v2 : signature (ES256/RS256 via JWKS, ou HS256), iss, aud, exp et nonce
        var decoder = java.util.Base64.getUrlDecoder();
        var b64uToString = function(s) {
        	return String(new java.lang.String(decoder.decode(s), "UTF-8"));
        };
        var b64uToBigInt = function(s) {
        	return new java.math.BigInteger(1, decoder.decode(s));
        };
        var jwksKeys = JSON.parse(String(fcJwksText)).keys || [];
        
        // Vérifie la signature d''un JWS FranceConnect et retourne son contenu (réutilisé pour userinfo)
        fcVerifyJws = function(token) {
        	var parts = String(token).trim().split(''.'');
        	if (parts.length != 3) {
        		throw new Error("[FC] JWS invalide");
        	}
        	var header = JSON.parse(b64uToString(parts[0]));
        	var data = new java.lang.String(parts[0] + "." + parts[1]).getBytes("US-ASCII");
        	var sig = decoder.decode(parts[2]);
        	var valid = false;
        	if (header.alg == "HS256") {
        		var mac = javax.crypto.Mac.getInstance("HmacSHA256");
        		mac.init(new javax.crypto.spec.SecretKeySpec(new java.lang.String(String(clientSecret)).getBytes("UTF-8"), "HmacSHA256"));
        		valid = java.security.MessageDigest.isEqual(mac.doFinal(data), sig);
        	} else if (header.alg == "ES256" || header.alg == "RS256") {
        		var jwk = null;
        		for (var i = 0; i < jwksKeys.length && jwk == null; i++) {
        			var k = jwksKeys[i];
        			if ((!header.kid || k.kid == header.kid) && (!k.alg || k.alg == header.alg) && (!k.use || k.use == "sig")) {
        				jwk = k;
        			}
        		}
        		if (jwk == null) {
        			throw new Error("[FC] clé de signature introuvable : " + header.kid);
        		}
        		var publicKey, verifier;
        		if (header.alg == "RS256") {
        			publicKey = java.security.KeyFactory.getInstance("RSA").generatePublic(new java.security.spec.RSAPublicKeySpec(b64uToBigInt(jwk.n), b64uToBigInt(jwk.e)));
        			verifier = java.security.Signature.getInstance("SHA256withRSA");
        		} else {
        			var params = java.security.AlgorithmParameters.getInstance("EC");
        			params.init(new java.security.spec.ECGenParameterSpec("secp256r1"));
        			var ecSpec = params.getParameterSpec(java.security.spec.ECParameterSpec);
        			var point = new java.security.spec.ECPoint(b64uToBigInt(jwk.x), b64uToBigInt(jwk.y));
        			publicKey = java.security.KeyFactory.getInstance("EC").generatePublic(new java.security.spec.ECPublicKeySpec(point, ecSpec));
        			verifier = java.security.Signature.getInstance("SHA256withECDSAinP1363Format");
        		}
        		verifier.initVerify(publicKey);
        		verifier.update(data);
        		valid = verifier.verify(sig);
        	} else {
        		throw new Error("[FC] algorithme de signature non supporté : " + header.alg);
        	}
        	if (!valid) {
        		throw new Error("[FC] signature invalide");
        	}
        	return JSON.parse(b64uToString(parts[1]));
        };
        
        db64 = fcVerifyJws(id_token);
        if (String(db64.iss) != String(fcIssuer)) {
        	throw new Error("[FC] émetteur de l''id_token invalide : " + db64.iss);
        }
        var audOk = Array.isArray(db64.aud) ? db64.aud.indexOf(String(fcClientId)) >= 0 : String(db64.aud) == String(fcClientId);
        if (!audOk) {
        	throw new Error("[FC] destinataire de l''id_token invalide");
        }
        if (!db64.exp || db64.exp * 1000 < new Date().getTime()) {
        	throw new Error("[FC] id_token expiré");
        }
        var expectedNonce = context.httpSession.getAttribute("fcNonce");
        context.httpSession.removeAttribute("fcNonce");
        if (expectedNonce == null || String(db64.nonce) != String(expectedNonce)) {
        	throw new Error("[FC] nonce invalide");
        }
        // id_token conservé en session pour la déconnexion (id_token_hint)
        context.httpSession.setAttribute("fcIdToken", new java.lang.String(String(id_token)));
        
        // Convert JSON to XML and attach it to main document
        var jsonObject = new org.codehaus.jettison.json.JSONObject(JSON.stringify(db64));
        xmlUtils.jsonToXml(jsonObject, "object", dom.getDocumentElement(), false, true, "item");
        gid = "fc:" + db64.sub;'
