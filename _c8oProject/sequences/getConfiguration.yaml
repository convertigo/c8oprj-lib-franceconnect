↓GenerateStateNonce [steps.SimpleStep-1790354094324]: 
  expression: |
    '// state et nonce OIDC générés côté serveur (aléa cryptographique, 32 caractères minimum en v2) et gardés en session.
    // Réutilisé tel quel s''il existe déjà : un appel concurrent (rechargement de la carte de configuration
    // pendant un flux de login en cours) ne doit pas invalider le state/nonce attendu par loginWithCode.
    var sr = new java.security.SecureRandom();
    var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    var rnd = function(n) {
    	var s = "";
    	for (var i = 0; i < n; i++) {
    		s += chars.charAt(sr.nextInt(chars.length));
    	}
    	return s;
    };
    fcState = context.httpSession.getAttribute("fcState");
    fcNonce = context.httpSession.getAttribute("fcNonce");
    if (fcState == null || String(fcState).length < 32) {
    	fcState = rnd(43);
    	context.httpSession.setAttribute("fcState", new java.lang.String(fcState));
    }
    if (fcNonce == null || String(fcNonce).length < 32) {
    	fcNonce = rnd(43);
    	context.httpSession.setAttribute("fcNonce", new java.lang.String(fcNonce));
    }'
