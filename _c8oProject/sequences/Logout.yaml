↓BuildLogoutUrl [steps.SimpleStep-1790356470640]: 
  expression: |
    '// Déconnexion FranceConnect v2 : URL /session/end à ouvrir par le navigateur
    var idToken = context.httpSession.getAttribute("fcIdToken");
    context.httpSession.removeAttribute("fcIdToken");
    fcLogoutUrl = "";
    if (idToken != null) {
    	var sr = new java.security.SecureRandom();
    	var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    	var logoutState = "";
    	for (var i = 0; i < 43; i++) {
    		logoutState += chars.charAt(sr.nextInt(chars.length));
    	}
    	fcLogoutUrl = String(fcEndSession) +
    		"?id_token_hint=" + encodeURIComponent(String(idToken)) +
    		"&state=" + logoutState +
    		"&post_logout_redirect_uri=" + encodeURIComponent(String(fcPostLogoutUri));
    }'
