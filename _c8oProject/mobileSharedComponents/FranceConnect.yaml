  ↓RestoreFcSession [ngx.components.UICustomAction-1790402746213]: 
    actionValue: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '		// FranceConnect shared component load handler.
            		// 1. Same-tab OIDC return: if the application URL carries code & state (FranceConnect
            		//    redirects back to lib_franceconnect.redirecturi), exchange the code through
            		//    loginWithCode, restore fcConnectedInfo, then clean the URL.
            		// 2. Otherwise, restore the FranceConnect session if one exists.
            		try {
            			let fcParams = new URLSearchParams(window.location.search);
            			let fcCode = fcParams.get("code");
            			let fcState = fcParams.get("state");
            			if (fcCode && fcState) {
            				window.history.replaceState({}, "", window.location.pathname + window.location.hash);
            				page.c8o.callJsonObject("lib_FranceConnect.loginWithCode", {code: fcCode, state: fcState}).then((data: any) => {
            					page.router.sharedObject["fcConnectedInfo"] = data["fcConnectedInfo"] || data;
            					resolve(true);
            					return null;
            				}).fail((err) => {
            					page.c8o.log.error("[FranceConnect] loginWithCode failed: " + JSON.stringify(err));
            					page.router.sharedObject["fcConnectedInfo"] = null;
            					resolve(true);
            				return null;
            				});
            			} else {
            				page.c8o.callJson("lib_FranceConnect.checkAccessOpenID").then((data, params) => {
            					page.router.sharedObject["fcConnectedInfo"] = data["fcConnectedInfo"] || null;
            					resolve(true);
            					return null;
            				}).fail((err) => {
            					page.c8o.log.error("[FranceConnect] checkAccessOpenID failed: " + JSON.stringify(err));
            					resolve(true);
            					return null;
            				});
            			}
            		} catch (e) {
            			page.c8o.log.error("[FranceConnect] restore session failed: " + JSON.stringify(e));
            			resolve(true);
            		}
            '
