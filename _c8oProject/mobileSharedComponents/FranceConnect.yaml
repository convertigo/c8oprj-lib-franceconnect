                  →: |
                    '		/**
                    	     * FranceConnect v2 - Client side OAuth Login (authorization code flow).
                    	     *
                    	     * Web: the current tab is redirected to the FranceConnect login page: no popup, so no
                    	     * browser popup permission is required. When FranceConnect sends the browser back to
                    	     * the application URL (lib_franceconnect.redirecturi) with code & state, the FranceConnect
                    	     * shared component''s load handler calls loginWithCode and restores fcConnectedInfo.
                    	     *
                    	     * Cordova: the login page opens in the InAppBrowser and the code is exchanged here.
                    	     *
                    	     * The server sequence loginWithCode validates state, nonce, signatures and flags the
                    	     * current session authenticated.
                    	     */
                    	    let openOAuthLoginCordova = function(url: String, redirectUri: String): Promise<any> {
                    	        return new Promise((resolve, reject) => {
                    	            url += "&redirect_uri=" + encodeURIComponent(redirectUri.toString());
                    	            const browserRef = (window["cordova"] as any).InAppBrowser.open(
                    	                url,
                    	                "_blank",
                    	                "location=no, clearsessioncache=yes, clearcache=yes"
                    	            );
                    	            let responseParams: string;
                    	            let parsedResponse: Object = {};
                    	            browserRef.addEventListener("loadstart", (evt) => {
                    	                page.c8o.log.debug("Auth Page loaded");
                    	                if ((evt.url).indexOf(redirectUri) === 0) {
                    	                    browserRef.close();
                    	                    responseParams = ((evt.url).split("?")[1]).split("&");
                    	                    for (var i = 0; i < responseParams.length; i++) {
                    	                        parsedResponse[responseParams[i].split("=")[0]] = responseParams[i].split("=")[1];
                    	                    }
                    	                    if (parsedResponse["code"] !== undefined && parsedResponse["code"] !== null) {
                    	                        resolve(parsedResponse);
                    	                    } else {
                    	                        page.c8o.log.error("[FranceConnect] oAuth authentication error: " + evt.url);
                    	                        reject("oAuth authentication error");
                    	                    }
                    	                }
                    	            });
                    	            browserRef.addEventListener("exit", function (evt) {
                    	                page.c8o.log.debug("Auth Page closed");
                    	            });
                    	        });
                    	    }
                    
                    		try {
                    			page.c8o.log.debug(''[FranceConnect] ''+ props.actionFunction +'': ''+ props.actionName);
                    			
                    			let scope 			= encodeURIComponent(vars.Scopes || ''openid family_name given_name'');
                    			let oAuthUrl 			= vars.AuthorizationEndpoint + ''?'' +
                    				''client_id='' + 		encodeURIComponent(vars.ClientID) +
                    				''&response_type=code'' +
                    				''&scope='' + 			scope +
                    				''&state='' + 			encodeURIComponent(vars.State) +
                    				''&acr_values=eidas1'' +
                    				''&nonce='' + 			encodeURIComponent(vars.Nonce) +
                    				''&redirect_uri='' + 	encodeURIComponent(vars.RedirectURL);
                    
                    			let data = await page.c8o.callJson("lib_FranceConnect.checkAccessOpenID");
                    			if (data["notoken"] == "true") {
                    				if (window["cordova"] != undefined) {
                    					// Mobile (Cordova): login page in the InAppBrowser, code exchanged inline
                    					let parsedResponse = await openOAuthLoginCordova(oAuthUrl, vars.RedirectURL);
                    					page.c8o.log.debug("Parsed response is : " + JSON.stringify(parsedResponse));
                    					let loginData = await page.c8o.callJsonObject("lib_FranceConnect.loginWithCode", parsedResponse);
                    					if (loginData["login"] == "ko") {
                    						throw loginData;
                    					}
                    					page.router.sharedObject["fcConnectedInfo"] = loginData["fcConnectedInfo"] || loginData;
                    					return loginData;
                    				} else {
                    					// Web: full-page redirect, no popup permission needed. The shared
                    					// component completes the login on the next page load.
                    					window.location.href = oAuthUrl;
                    					return true;
                    				}
                    			} else {
                    				// Already connected: just restore the connection info
                    				page.router.sharedObject["fcConnectedInfo"] = data["fcConnectedInfo"];
                    				return data;
                    			}
                    		} catch (e) {
                    			page.c8o.log.error(''[FranceConnect] '' + JSON.stringify(e));
                    			throw e;
                    		}
                    '
